<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagamento Pix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     CHECKOUT, no sistema da Koonfy — o mesmo de /assinar e da vitrine.

     O que muda em relação à versão anterior é a base: carbono no lugar do
     cinza-azulado, tipografia Inter em dois pesos, cantos de 4px no que é
     interativo e 12px nos cartões, e rótulos de utilidade em caixa alta com
     tracking. A ESTRUTURA é a mesma — duas colunas, resumo grudado, blocos
     opcionais —, e todos os nomes de classe continuam valendo, porque quem
     monta esta página é o JS logo abaixo.

     O ACENTO CONTINUA SENDO DO LOJISTA. `--ac` vem da cor escolhida no
     Checkout Builder, e tudo que depende dela é derivado por color-mix em vez
     de fixado: assim o checkout de quem escolheu laranja fica laranja, sem
     precisar de uma segunda folha de estilo.
     ========================================================================= */
  :root {
    --ac: #2ed378;                /* acento — sobrescrito pela cor do checkout */
    --carbono: #111111;
    --painel: #171d1a;            /* a superfície dos cartões */
    --fundo-campo: #131817;       /* um degrau abaixo: campos e códigos */
    --osso: #f9f9f9;
    --pedra: #9c9c9c;
    --fio: #2b2b2b;
    /* papéis, para o resto da folha não repetir as cores cruas */
    --bg: var(--carbono);
    --card: var(--painel);
    --line: var(--fio);
    --ink: var(--osso);
    --mut: var(--pedra);
    /* A base do botão: o acento fechado. Texto branco sobre o acento puro fica
       ilegível em quase toda cor de marca; fechando 55% para o preto, o rótulo
       lê e a cor continua sendo a do lojista. */
    --ac-fundo: color-mix(in srgb, var(--ac) 55%, #000);
    --ac-fraco: color-mix(in srgb, var(--ac) 12%, transparent);
    --fonte: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --r: 4px;                     /* interativo */
    --rc: 12px;                   /* cartão */
  }
  /* MODO CLARO. Só os seis papéis mudam: a folha inteira fala por eles, e é
     por isso que os dois modos não divergem com o tempo. O acento não entra
     aqui porque é do lojista e vale nos dois. */
  :root[data-tema="claro"] {
    --carbono: #f4f6f5;
    --painel: #ffffff;
    --fundo-campo: #fbfcfc;
    --osso: #131816;
    --pedra: #5f6b66;
    --fio: #e2e7e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--fonte); font-size: 16px; line-height: 1.5; font-weight: 400;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-font-smoothing: antialiased; font-feature-settings: "kern" on, "liga" on;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 64px; }

  /* ---------- cabeçalho do lojista ---------- */
  .site-head { border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  .head-inner { max-width: 1000px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: var(--painel); flex: none; }
  .brand .ph { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--ac); color: #06301b; font-weight: 500; font-size: 17px; flex: none; }
  .brand b { font-size: 15px; font-weight: 500; display: block; letter-spacing: -.01em; }
  .brand small { font-size: 12px; color: var(--mut); font-weight: 400; }
  .secure {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500;
    letter-spacing: .032em; text-transform: uppercase; color: var(--mut);
    background: transparent; border: 1px solid var(--line); padding: 8px 14px; border-radius: var(--r); white-space: nowrap;
  }
  .secure svg { color: var(--ac); flex: none; }
  .head-banner { display: block; width: 100%; max-height: 320px; object-fit: cover; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rc); }
  .pad { padding: 28px 30px; }
  .stack > * + * { margin-top: 16px; }

  /* ---------- passos ---------- */
  .steps { display: flex; align-items: center; padding: 22px 30px 0; }
  .stp { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); }
  .stp i { width: 22px; height: 22px; border-radius: var(--r); font-style: normal; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; background: var(--fio); color: var(--mut); border: 0; transition: background .25s, color .25s; }
  .stp.cur i { background: var(--ac); color: #06301b; }
  .stp.done i { background: var(--ac-fraco); color: var(--ac); }
  .stp.cur { color: var(--ink); }
  .stpsep { flex: 1; height: 1px; background: var(--line); margin: 0 14px; }
  .stpsep.done { background: color-mix(in srgb, var(--ac) 45%, var(--fio)); }

  h2.sect { font-size: 22px; font-weight: 400; line-height: 1.2; letter-spacing: -.01em; margin-bottom: 4px; }
  .sect-sub { font-size: 14px; color: var(--mut); margin-bottom: 22px; }

  /* ---------- campos ---------- */
  .fld { margin-bottom: 16px; }
  .fld label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); margin-bottom: 7px; }
  .fld input {
    width: 100%; font-size: 16px; padding: 13px 14px; border-radius: var(--r); font-family: inherit;
    border: 1px solid var(--line); background: var(--fundo-campo); color: var(--ink); outline: none;
    transition: border-color .12s, background .12s;
  }
  .fld input::placeholder { color: #5a635f; }
  .fld input:focus { border-color: var(--ac); background: var(--painel); }
  .fld input.bad { border-color: #ff8080; }
  .frow { display: flex; gap: 14px; }
  .frow .fld { flex: 1; min-width: 0; }
  .fld select {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r);
    font: inherit; font-size: 16px; background: var(--fundo-campo); color: var(--ink);
  }
  .fld select:focus { border-color: var(--ac); background: var(--painel); outline: none; }

  /* ---------- seletor Pix / Cartão ---------- */
  .paytabs { display: flex; gap: 10px; margin-bottom: 22px; }
  .paytabs button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: transparent;
    font: inherit; font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase;
    color: var(--mut); cursor: pointer; transition: border-color .15s, color .15s, background .15s;
  }
  .paytabs button:hover { border-color: var(--mut); color: var(--ink); }
  .paytabs button.on { border-color: var(--ac); color: var(--ac); background: var(--ac-fraco); }
  .paytabs button svg { flex: none; }

  /* ---------- crédito / débito ---------- */
  .kindrow { display: flex; gap: 10px; margin-bottom: 18px; }
  .kind {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px; border: 1px solid var(--line); border-radius: var(--r); background: transparent;
    font-size: 14px; font-weight: 400; color: var(--mut); cursor: pointer;
  }
  .kind.on { border-color: var(--ac); color: var(--ac); background: var(--ac-fraco); }
  .kind input { accent-color: var(--ac); }
  .form-err { display: none; font-size: 14px; color: #ff8080; border: 1px solid #4a2626; background: #1d1414; border-radius: var(--r); padding: 10px 13px; margin-bottom: 16px; }
  .form-err.show { display: block; }
  .legal { display: flex; gap: 9px; font-size: 12px; color: var(--mut); line-height: 1.55; margin-top: 4px; }
  .legal svg { flex: none; margin-top: 2px; }

  /* ---------- a ação ----------
     O mesmo botão do "Começar agora" e do "Assinar" da vitrine: a base é o
     acento fechado e o próprio acento atravessa em diagonal. A faixa só existe
     porque o gradiente é o dobro do botão — o que anda é a POSIÇÃO dele. */
  .btn {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 16px;
    border-radius: var(--r); padding: 15px 18px; width: 100%; color: #fff;
    background: var(--btn-grad, linear-gradient(var(--btn-ang, 45deg),
                var(--ac-fundo), var(--ac-fundo), var(--ac),
                var(--ac-fundo), var(--ac-fundo)));
    background-size: 200% 200%;
    animation: passar 5s ease-in-out infinite;
  }
  /* CHAPADO: o dono do checkout pode desligar a faixa. Aí o botão é o acento
     puro, e o texto passa a ser calculado contra ele em vez de branco fixo. */
  /* No claro a sombra volta a existir: sem ela, cartão branco sobre fundo
     quase branco vira uma mancha só. No escuro é a borda que separa. */
  :root[data-tema="claro"] .card { box-shadow: 0 1px 3px rgba(20,30,25,.06); }
  :root[data-tema="claro"] .toast { background: #131816; color: #f9f9f9; }
  :root[data-botao="chapado"] .btn {
    background: var(--ac); background-size: auto; animation: none;
    color: color-mix(in srgb, var(--ac) 22%, #000);
  }
  .btn:hover { opacity: .92; }
  .btn:disabled { opacity: .5; cursor: wait; animation: none; }
  @keyframes passar { 0% { background-position: 0% 50% } 50% { background-position: 100% 50% } 100% { background-position: 0% 50% } }

  /* ---------- blocos opcionais ---------- */
  .blk { padding: 24px 30px; }
  .blk-t { font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .timer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 20px; border-radius: var(--rc); background: var(--ac-fraco); border: 1px solid color-mix(in srgb, var(--ac) 30%, transparent); flex-wrap: wrap; }
  .timer-txt { font-size: 14px; font-weight: 400; color: var(--ink); }
  .timer-clock { display: flex; gap: 6px; }
  .timer-clock span { background: var(--ac); color: #06301b; font-weight: 500; font-size: 16px; padding: 6px 10px; border-radius: var(--r); font-variant-numeric: tabular-nums; }
  .notice { padding: 13px 16px; border-radius: var(--r); background: #1d1a11; border: 1px solid #4a3f1e; color: #e3c46a; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .notice svg { flex: none; margin-top: 2px; }
  .benef li { list-style: none; display: flex; gap: 11px; align-items: flex-start; font-size: 14px; color: var(--mut); line-height: 1.55; margin-bottom: 10px; }
  .benef li svg { flex: none; margin-top: 2px; color: var(--ac); }
  .testi { display: flex; gap: 14px; }
  .testi-av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--ac-fraco); color: var(--ac); display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px; }
  .testi p { font-size: 14px; color: var(--mut); line-height: 1.6; }
  .testi b { display: block; font-size: 13px; font-weight: 500; margin-top: 9px; color: var(--ink); }
  .testi small { color: var(--mut); font-size: 12px; }
  .stars { color: #e3c46a; letter-spacing: 1px; font-size: 13px; margin-bottom: 7px; }
  .guar { display: flex; gap: 15px; align-items: center; }
  .guar-seal { width: 54px; height: 54px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--ac-fraco); color: var(--ac); }
  .guar b { display: block; font-size: 15px; font-weight: 500; }
  .guar p { font-size: 13px; color: var(--mut); line-height: 1.55; margin-top: 4px; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 0; }
  .faq summary { cursor: pointer; padding: 14px 0; font-size: 15px; font-weight: 400; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: '+'; color: var(--ac); font-size: 19px; font-weight: 400; flex: none; }
  .faq details[open] summary::after { content: '−'; }
  .faq p { font-size: 14px; color: var(--mut); line-height: 1.6; padding: 0 0 15px; }

  /* ---------- resumo do pedido ---------- */
  .summary { position: sticky; top: 24px; }
  .summary .card { overflow: hidden; }
  .sum-head { font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); padding: 22px 24px 0; }
  .prod { display: flex; gap: 14px; padding: 16px 24px 18px; border-bottom: 1px solid var(--line); }
  .prod-img { width: 62px; height: 62px; border-radius: 10px; object-fit: cover; flex: none; background: var(--fundo-campo); }
  .prod-img.ph { display: flex; align-items: center; justify-content: center; color: var(--ac); background: var(--ac-fraco); font-weight: 500; font-size: 22px; }
  .prod-img.pix svg { width: 30px; height: 30px; }
  .prod-info { min-width: 0; align-self: center; }
  .prod-info b { font-size: 15px; font-weight: 500; line-height: 1.3; display: block; letter-spacing: -.01em; }
  .prod-info span { font-size: 12px; color: var(--mut); display: block; margin-top: 4px; line-height: 1.45; }
  .rows { padding: 16px 24px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--mut); padding: 5px 0; }
  .row.total { font-size: 22px; font-weight: 400; letter-spacing: -.01em; color: var(--ink); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; }
  .sum-cta { padding: 0 24px 22px; }
  /* AS BANDEIRAS aceitas, embaixo do numero. Nascem visiveis e apagadas: e a
     lista do que passa. Reconhecida a bandeira, a dela acende e as outras
     baixam — nao somem, porque sumir mudaria a altura da caixa no meio da
     digitacao, e campo que pula enquanto se digita e como se perde um numero
     de cartao. */
  .bandeiras { display: flex; align-items: center; gap: 7px; margin: -6px 0 14px; min-height: 26px; }
  .bandeiras img { height: 25px; width: auto; border-radius: 3px; opacity: .5; filter: grayscale(1); transition: opacity .2s, filter .2s; }
  .bandeiras img.on { opacity: 1; filter: none; }
  .bandeiras img.off { opacity: .22; }
  .bandeira-mais { font-size: 11.5px; color: var(--fraco, #8a938f); letter-spacing: .01em; }
  .bandeira-mais.on { color: var(--ac); font-weight: 600; }
  .sum-note { font-size: 12px; color: var(--mut); text-align: center; margin-top: 12px; line-height: 1.5; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .waiting { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--ac); padding: 14px; border: 1px solid color-mix(in srgb, var(--ac) 30%, transparent); background: var(--ac-fraco); border-radius: var(--r); }
  .waiting .pulse { width: 9px; height: 9px; border-radius: 99px; background: var(--ac); animation: pulse 1.6s ease infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac) 45%, transparent) } 50% { box-shadow: 0 0 0 6px transparent } }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); background: transparent; border: 1px solid var(--line); padding: 8px 12px; border-radius: var(--r); }
  .badge svg { color: var(--ac); flex: none; }

  /* ---------- pagamento (etapa 2) ---------- */
  .payer-chip { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--mut); background: var(--fundo-campo); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; margin-bottom: 20px; }
  .payer-chip svg { color: var(--ac); flex: none; }
  .qrwrap { display: flex; gap: 22px; align-items: center; }
  @media (max-width: 560px) { .qrwrap { flex-direction: column; text-align: center; } }
  /* O QR precisa de fundo BRANCO: é ele que a câmera lê, e um QR escuro em
     fundo escuro simplesmente não é reconhecido pela maioria dos bancos. */
  .qrframe { flex: none; padding: 12px; border-radius: var(--rc); background: #fff; }
  .qrframe img, .qrframe svg.qr { width: 158px; height: 158px; display: block; }
  .qrside { min-width: 0; }
  .qrside h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
  .qrside ol { list-style: none; counter-reset: s; }
  .qrside li { counter-increment: s; position: relative; padding-left: 28px; font-size: 13px; color: var(--mut); line-height: 1.5; margin-bottom: 8px; }
  .qrside li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 19px; height: 19px; border-radius: var(--r); background: var(--fio); color: var(--mut); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
  .qrside li b { color: var(--ink); font-weight: 500; }
  .expiry { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: #e3c46a; margin-top: 6px; }
  .orlbl { display: flex; align-items: center; gap: 14px; font-size: 11px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; color: var(--mut); margin: 24px 0 13px; }
  .orlbl::before, .orlbl::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .copywrap { position: relative; }
  .copywrap input { width: 100%; font-size: 12px; padding: 13px 96px 13px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--fundo-campo); color: var(--mut); font-family: ui-monospace, 'SF Mono', Menlo, monospace; outline: none; text-overflow: ellipsis; }
  .copywrap .cbtn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; padding: 9px 13px; border-radius: var(--r); background: var(--painel); color: var(--ink); }
  .copywrap .cbtn:hover { border-color: var(--ac); color: var(--ac); }

  /* ---------- estados finais ---------- */
  .final { text-align: center; padding: 48px 30px; }
  .fic { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
  .final.ok .fic { background: var(--ac-fraco); color: var(--ac); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .final.dead .fic { background: #1d1414; color: #ff8080; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .final h2 { font-size: 34px; font-weight: 400; line-height: 1.05; letter-spacing: -.01em; margin-bottom: 10px; }
  .final p { font-size: 15px; color: var(--mut); line-height: 1.6; white-space: pre-line; max-width: 400px; margin: 0 auto; }
  .receipt { max-width: 340px; margin: 26px auto 0; border: 1px solid var(--line); border-radius: var(--rc); text-align: left; overflow: hidden; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--mut); padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .receipt div:last-child { border-bottom: 0; }
  .receipt b { color: var(--ink); font-weight: 500; text-align: right; }

  .spin { width: 34px; height: 34px; border: 2px solid var(--fio); border-top-color: var(--ac); border-radius: 50%; margin: 22vh auto; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg) } }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--osso); color: var(--carbono); font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: var(--r); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; }
  .demo-tag { position: fixed; top: 14px; right: 14px; z-index: 6; background: var(--painel); border: 1px solid var(--line); color: #e3c46a; font-size: 11px; font-weight: 500; letter-spacing: .032em; text-transform: uppercase; padding: 7px 12px; border-radius: var(--r); }
  .fade-in { animation: fi .3s ease; }
  @keyframes fi { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  /* ---------- quem processa ---------- */
  /* A marca escrita entra como MÁSCARA: assume a cor do rodapé, então o mesmo
     arquivo serve o claro e o escuro sem uma segunda versão para manter. */
  .processa {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mut);
  }
  .processa i {
    width: 20px; height: 20px; border-radius: 6px; flex: none;
    background: url(/assets/koonfy-192.png) center/contain no-repeat;
  }
  .processa b {
    display: block; width: 66px; height: 17px; background: currentColor;
    transform: translateY(11.5%);
    -webkit-mask: url(/assets/koonfy-marca.webp) center/contain no-repeat;
    mask: url(/assets/koonfy-marca.webp) center/contain no-repeat;
  }

  @media (prefers-reduced-motion: reduce) { .btn { animation: none; background-position: 0 50% } }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .summary { position: static; }   /* mobile: formulário primeiro, resumo depois */
    .head-banner { max-height: 210px; }
    .wrap { padding: 0 16px 40px; }
    .head-inner { padding: 14px 16px; }
    .pad, .blk { padding: 22px 18px; }
    h2.sect { font-size: 19px; }
    .final h2 { font-size: 26px; }
  }
  /* SELETOR DE MEIO DA ASSINATURA. Alvo grande e rótulo com a explicação do
     que cada um faz: "Pix Automático" e "Boleto" soam parecidos para quem
     nunca assinou nada, e a diferença (um cobra sozinho, o outro não) é a
     única coisa que a pessoa precisa saber para escolher. */
  .met-list { display: flex; flex-direction: column; gap: 8px; }
  .met {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    padding: 12px 13px; text-align: left; cursor: pointer;
    background: var(--card, #fff); border: 1.5px solid var(--line, #e3e8e5);
    border-radius: 11px; font: inherit; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .met:hover { border-color: var(--brand, #10b981); }
  .met.on { border-color: var(--brand, #10b981); background: rgba(16,185,129,.06); }
  .met-dot {
    width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 2px;
    border: 1.5px solid var(--line, #e3e8e5); background: transparent;
    transition: border-color .15s, box-shadow .15s;
  }
  .met.on .met-dot {
    border-color: var(--brand, #10b981);
    box-shadow: inset 0 0 0 4px var(--brand, #10b981);
  }
  .met b { display: block; font-size: 13.5px; font-weight: 600; }
  .met em { display: block; font-style: normal; font-size: 12px; opacity: .7; margin-top: 2px; }
</style>
</head>
<body>
<div id="root"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  // O ENDEREÇO diz o que esta página é:
  //   /pay/<id> (ou <dominio>/<id>) → uma COBRANÇA que já existe
  //   /c/<apelido>                  → o LINK DE UM PRODUTO, sem cobrança ainda
  //
  // `id` é variável, e não constante: no link do produto ele nasce depois, no
  // envio dos dados. Todo o resto do arquivo já falava com `id`, então a
  // segunda porta não criou um segundo caminho para manter.
  var partes = location.pathname.split('/').filter(Boolean);
  var apelidoProduto = partes[0] === 'c' ? decodeURIComponent(partes[1] || '') : '';
  var id = apelidoProduto ? '' : (partes[partes.length - 1] || '');
  var root = document.getElementById('root');
  var data = null, timer = null, cdTimer = null, offerTimer = null;

  // De onde vem a primeira carga. As duas respostas têm o mesmo formato: a do
  // produto é a mesma tela sem cobrança, esperando os dados.
  function enderecoInicial() {
    return apelidoProduto
      ? '/api/public/produto/' + encodeURIComponent(apelidoProduto)
      : '/api/public/pay/' + encodeURIComponent(id);
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function brl(c) { return (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function isMobile() { return window.matchMedia('(max-width: 860px)').matches; }

  // ---- ícones (mesmo traço Feather do Koonfy) ----
  function svg(p, s) { return '<svg width="' + (s || 13) + '" height="' + (s || 13) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
  var ICO = {
    lock:   '<rect x="3.5" y="10.5" width="17" height="11" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>',
    check:  '<polyline points="20 6 9 17 4 12"/>',
    shield: '<path d="M12 3l7 3.5v5c0 4.3-2.9 8-7 9.2-4.1-1.2-7-4.9-7-9.2v-5L12 3z"/>',
    clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
    alert:  '<path d="M12 3.6 1.9 20.4h20.2L12 3.6z"/><path d="M12 10v4M12 17.4h.01"/>',
    bolt:   '<path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/>',
    card:   '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/>'
  };
  function ico(n, s) { return svg(ICO[n] || '', s); }
  // A marca do Pix, a mesma do painel. Antes aqui havia um losango vazado com
  // um quadradinho no meio: em 14px aquilo virava um "0" — não parecia Pix
  // nenhum, e é o selo que o cliente olha na hora de pagar.
  var pix = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'
    + '<g transform="scale(1.5)">'
    + '<path d="M11.917 11.71a2.046 2.046 0 0 1-1.454-.602l-2.1-2.1a.4.4 0 0 0-.551 0l-2.108 2.108a2.044 2.044 0 0 1-1.454.602h-.414l2.66 2.66c.83.83 2.177.83 3.007 0l2.667-2.668h-.253zM4.25 4.282c.55 0 1.066.214 1.454.602l2.108 2.108a.39.39 0 0 0 .552 0l2.1-2.1a2.044 2.044 0 0 1 1.453-.602h.253L9.503 1.623a2.127 2.127 0 0 0-3.007 0l-2.66 2.66h.414z"/>'
    + '<path d="m14.377 6.496-1.612-1.612a.307.307 0 0 1-.114.023h-.733c-.379 0-.75.154-1.017.422l-2.1 2.1a1.005 1.005 0 0 1-1.425 0L5.268 5.32a1.448 1.448 0 0 0-1.018-.422h-.9a.306.306 0 0 1-.109-.021L1.623 6.496c-.83.83-.83 2.177 0 3.008l1.618 1.618a.305.305 0 0 1 .108-.022h.901c.38 0 .75-.153 1.018-.421L7.375 8.57a1.034 1.034 0 0 1 1.426 0l2.1 2.1c.267.268.638.421 1.017.421h.733c.04 0 .079.01.114.024l1.612-1.612c.83-.83.83-2.178 0-3.008z"/>'
    + '</g></svg>';

  function maskDoc(v) {
    var d = v.replace(/\D/g, '').slice(0, 14);
    if (d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2');
  }
  // ---- CPF / CNPJ: dígitos verificadores ----
  // Antes só se contava quantos dígitos tinham, então "123.456.789-01" passava
  // e a cobrança só era recusada lá na frente, pelo adquirente, com uma
  // mensagem que não dizia o que corrigir. A conta é a mesma que a Receita usa;
  // acertar os dois dígitos no chute é 1 em 100.
  function cpfOk(d) {
    if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
    for (var r = 0; r < 2; r++) {
      var ate = 9 + r, soma = 0;
      for (var i = 0; i < ate; i++) soma += Number(d[i]) * (ate + 1 - i);
      var resto = (soma * 10) % 11;
      if ((resto === 10 ? 0 : resto) !== Number(d[ate])) return false;
    }
    return true;
  }
  function cnpjOk(d) {
    if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
    function confere(ate) {
      var soma = 0, peso = ate - 7;
      for (var i = 0; i < ate; i++) { soma += Number(d[i]) * peso; peso = peso === 2 ? 9 : peso - 1; }
      var resto = soma % 11;
      return (resto < 2 ? 0 : 11 - resto) === Number(d[ate]);
    }
    return confere(12) && confere(13);
  }
  function docOk(v) {
    var d = String(v || '').replace(/\D/g, '');
    return d.length === 11 ? cpfOk(d) : d.length === 14 ? cnpjOk(d) : false;
  }
  // Mensagem que diz onde olhar: "CPF inválido", não "documento inválido".
  function docErro(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (!d) return 'Informe o CPF ou CNPJ.';
    if (d.length !== 11 && d.length !== 14) {
      return 'CPF ou CNPJ incompleto: ' + (d.length < 11 ? 'faltam dígitos.' : 'dígitos a mais.');
    }
    if (docOk(d)) return '';
    return d.length === 11 ? 'CPF inválido. Confira os números digitados.'
                           : 'CNPJ inválido. Confira os números digitados.';
  }
  function maskPhone(v) {
    var d = v.replace(/\D/g, '').slice(0, 13);
    if (d.startsWith('55') && d.length > 11) d = d.slice(2);
    d = d.slice(0, 11);
    if (d.length <= 10) return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d{1,4})$/, '$1-$2');
    return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d{1,4})$/, '$1-$2');
  }

  function demoQr() {
    var cells = '', seed = 7;
    for (var y = 0; y < 21; y++) for (var x = 0; x < 21; x++) {
      seed = (seed * 137 + x * 31 + y * 17) % 97;
      if (seed % 3 === 0) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
    }
    var eye = function (cx, cy) { return '<rect x="' + cx + '" y="' + cy + '" width="7" height="7" fill="none" stroke="#1a2233" stroke-width="1"/><rect x="' + (cx + 2) + '" y="' + (cy + 2) + '" width="3" height="3"/>'; };
    return '<svg class="qr" viewBox="-1 -1 23 23" xmlns="http://www.w3.org/2000/svg" fill="#1a2233">' + cells + eye(0, 0) + eye(14, 0) + eye(0, 14) + '</svg>';
  }

  // imagem certa para o dispositivo (cai para a de desktop se não houver a mobile)
  function pickLogo(ck) { return (isMobile() && ck.logoMobile) ? ck.logoMobile : (ck.logo || ck.logoMobile || ''); }
  function pickBanner(ck) { return (isMobile() && ck.bannerMobile) ? ck.bannerMobile : (ck.banner || ck.bannerMobile || ''); }

  // ---------- header do site (marca + banner) ----------
  function siteHead(ck) {
    var name = ck.merchant || ck.title || 'Pagamento';
    var initial = name.trim().charAt(0).toUpperCase();
    var logo = pickLogo(ck), banner = pickBanner(ck);
    var showBanner = banner && (ck.blocks || []).indexOf('banner') >= 0;
    return '<header class="site-head">' +
      '<div class="head-inner">' +
        '<div class="brand">' +
          (logo ? '<img src="' + esc(logo) + '" alt="">' : '<span class="ph">' + esc(initial) + '</span>') +
          '<div><b>' + esc(name) + '</b><small>Pagamento via Pix</small></div>' +
        '</div>' +
        '<span class="secure">' + ico('lock', 12) + ' Compra segura</span>' +
      '</div>' +
      (showBanner ? '<img class="head-banner" src="' + esc(banner) + '" alt="">' : '') +
    '</header>';
  }

  // ---------- blocos opcionais ----------
  function blkTimer(ck) {
    var t = ck.timer || {}; if (!t.on) return '';
    return '<div class="card"><div class="blk"><div class="timer">' +
      '<span class="timer-txt">' + ico('clock', 14) + ' ' + esc(t.text || 'Oferta por tempo limitado!') + '</span>' +
      '<span class="timer-clock" id="offer-clock"><span>--</span><span>--</span></span>' +
    '</div></div></div>';
  }
  function blkNotice(ck) {
    var n = ck.notice || {}; if (!n.on || !n.text) return '';
    return '<div class="card"><div class="blk"><div class="notice">' + ico('alert', 15) + '<span>' + esc(n.text) + '</span></div></div></div>';
  }
  function blkBenefits(ck) {
    var b = ck.benefits || {}; if (!b.on || !(b.items || []).length) return '';
    return '<div class="card"><div class="blk"><div class="blk-t">' + ico('bolt', 16) + ' ' + esc(b.title || 'O que você recebe') + '</div><ul class="benef">' +
      b.items.map(function (i) { return '<li>' + ico('check', 15) + '<span>' + esc(i) + '</span></li>'; }).join('') + '</ul></div></div>';
  }
  function blkTestimonial(ck) {
    var t = ck.testimonial || {}; if (!t.on || !t.text) return '';
    var ini = (t.name || 'C').trim().charAt(0).toUpperCase();
    return '<div class="card"><div class="blk"><div class="testi">' +
      '<div class="testi-av">' + esc(ini) + '</div>' +
      '<div><div class="stars">★★★★★</div><p>“' + esc(t.text) + '”</p>' +
      (t.name ? '<b>' + esc(t.name) + (t.role ? ' <small>· ' + esc(t.role) + '</small>' : '') + '</b>' : '') +
      '</div></div></div></div>';
  }
  function blkGuarantee(ck) {
    var g = ck.guarantee || {}; if (!g.on) return '';
    var txt = (g.text || 'Garantia incondicional de {dias} dias, devolvemos 100% do valor.').replace('{dias}', g.days || 7);
    return '<div class="card"><div class="blk"><div class="guar">' +
      '<div class="guar-seal">' + ico('shield', 26) + '</div>' +
      '<div><b>Garantia de ' + (g.days || 7) + ' dias</b><p>' + esc(txt) + '</p></div>' +
    '</div></div></div>';
  }
  function blkFaq(ck) {
    var f = ck.faq || {}; if (!f.on || !(f.items || []).length) return '';
    return '<div class="card"><div class="blk"><div class="blk-t">Perguntas frequentes</div><div class="faq">' +
      f.items.map(function (i) { return '<details><summary>' + esc(i.q) + '</summary><p>' + esc(i.a) + '</p></details>'; }).join('') +
    '</div></div></div>';
  }
  var BLK = { timer: blkTimer, notice: blkNotice, benefits: blkBenefits, testimonial: blkTestimonial, guarantee: blkGuarantee, faq: blkFaq };

  // monta os blocos na ORDEM definida no builder ('product' = o card principal)
  function mainColumn(ck, mainHtml) {
    var order = (ck.blocks && ck.blocks.length) ? ck.blocks : ['banner', 'timer', 'product', 'notice', 'benefits', 'testimonial', 'guarantee', 'faq'];
    var out = '';
    for (var i = 0; i < order.length; i++) {
      var k = order[i];
      if (k === 'product') out += mainHtml;
      else if (k === 'banner') continue;              // banner vive no header do site
      else if (BLK[k]) out += BLK[k](ck);
    }
    if (order.indexOf('product') < 0) out += mainHtml;
    return '<div class="stack">' + out + '</div>';
  }

  function badges(ck) {
    if (!(ck.badges || {}).on) return '';
    return '<div class="badges">' +
      '<span class="badge">' + ico('lock', 12) + ' Ambiente seguro</span>' +
      '<span class="badge">' + ico('shield', 12) + ' Dados protegidos</span>' +
      '<span class="badge">' + ico('bolt', 12) + ' Aprovação imediata</span>' +
    '</div>';
  }

  function summary(ck, ctaHtml) {
    var name = ck.title || 'Pagamento Pix';
    var logo = pickLogo(ck);
    return '<aside class="summary"><div class="card">' +
      '<div class="sum-head">Resumo do pedido</div>' +
      '<div class="prod">' +
        // Sem logo, aqui vai a MARCA DO PIX, não a inicial do lojista. Este
        // quadrado é o slot do produto, e uma letra sozinha nele lê como imagem
        // quebrada — "O" de "ONG" virava um zero na tela. O nome do lojista já
        // está no cabeçalho; o que falta dizer aqui é como se paga.
        (logo ? '<img class="prod-img" src="' + esc(logo) + '" alt="">' : '<div class="prod-img ph pix">' + pix + '</div>') +
        '<div class="prod-info"><b>' + esc(name) + '</b>' +
          (ck.description ? '<span>' + esc(ck.description.length > 70 ? ck.description.slice(0, 70) + '…' : ck.description) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="rows">' +
        '<div class="row"><span>Subtotal</span><span>' + brl(data.value) + '</span></div>' +
        '<div class="row"><span>Taxas</span><span>Grátis</span></div>' +
        '<div class="row total"><span>Total</span><span>' + brl(data.value) + '</span></div>' +
      '</div>' +
      (ctaHtml ? '<div class="sum-cta">' + ctaHtml + '</div>' : '') +
    '</div>' + badges(ck) +
    (ck.supportText ? '<div class="sum-note">' + esc(ck.supportText) + '</div>' : '') +
    // Quem chega numa pagina de pagamento de uma loja que nao conhece procura,
    // no rodape, quem esta por tras da cobranca. E o gesto que decide entre
    // digitar o cartao e fechar a aba.
    '<div class="processa"><i aria-hidden="true"></i>' +
      '<span>Pagamento processado por</span>' +
      '<b role="img" aria-label="Koonfy"></b></div>' +
    '</aside>';
  }

  function stepsBar(cur) {
    var st = function (n, label) {
      var cls = n < cur ? 'done' : (n === cur ? 'cur' : '');
      return '<div class="stp ' + cls + '"><i>' + (n < cur ? '✓' : n) + '</i>' + label + '</div>';
    };
    return '<div class="steps">' + st(1, 'Identificação') + '<div class="stpsep' + (cur > 1 ? ' done' : '') + '"></div>' + st(2, 'Pagamento') + '</div>';
  }

  function countdown(exp) {
    var el = document.getElementById('cd'); if (!el || !exp) return;
    function tick() {
      var s = Math.floor((exp - Date.now()) / 1000);
      if (s <= 0) { el.textContent = 'Cobrança expirada'; load(); return; }
      var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
      el.textContent = 'Expira em ' + (h > 0 ? h + 'h ' : '') + m + 'min' + (h <= 0 ? ' ' + ss + 's' : '');
      cdTimer = setTimeout(tick, 1000);
    }
    clearTimeout(cdTimer); tick();
  }
  // cronômetro de escassez (bloco opcional), persiste por cobrança
  function startOffer(ck) {
    var t = ck.timer || {}; if (!t.on) return;
    var key = 'ec_offer_' + id, end = +localStorage.getItem(key);
    if (!end || end < Date.now()) { end = Date.now() + (t.minutes || 15) * 60000; try { localStorage.setItem(key, end); } catch (e) {} }
    function tick() {
      var el = document.getElementById('offer-clock'); if (!el) return;
      var s = Math.max(0, Math.floor((end - Date.now()) / 1000));
      var m = Math.floor(s / 60), ss = s % 60;
      el.innerHTML = '<span>' + String(m).padStart(2, '0') + '</span><span>' + String(ss).padStart(2, '0') + '</span>';
      if (s > 0) offerTimer = setTimeout(tick, 1000);
    }
    clearTimeout(offerTimer); tick();
  }

  // ---------- etapa 1: identificação ----------
  // É ASSINATURA? Só quando o servidor disse que sim E que dá para usar. O
  // produto pode estar marcado como recorrente numa plataforma cujo processador
  // Pix não é a Woovi — aí o Pix Automático não existe, e oferecer um botão de
  // "Assinar" que não assina é pior do que não oferecer nada.
  function ehAssinatura() {
    return !!(data && data.assinatura && data.assinatura.on && data.assinatura.disponivel);
  }

  // A ASSINATURA NÃO TERMINA AQUI, e a tela precisa dizer isso com todas as
  // letras. Diferente do Pix avulso — que acaba quando o QR é pago — aqui nada
  // foi cobrado ainda: falta a pessoa autorizar no banco dela. Uma tela de
  // "pronto!" neste ponto faria o comprador fechar a página achando que
  // assinou, e o vendedor ver uma assinatura que nunca cobra.
  function assinaturaMain(ck, a) {
    return '<div class="card fade-in"><div class="pad">' +
      '<h2 class="sect">Falta autorizar no seu banco</h2>' +
      '<div class="sect-sub">A sua assinatura de ' + esc(a.nome || '') + ' foi criada. ' +
      'Para ela começar a valer, autorize o Pix Automático no aplicativo do seu banco.</div>' +
      (a.autorizacaoUrl
        ? '<a class="btn" href="' + esc(a.autorizacaoUrl) + '" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Autorizar no meu banco</a>'
        : '<div class="form-err show">O link de autorização não veio. Fale com o vendedor antes de tentar de novo — ' +
          'a assinatura já existe, e criar outra faria você ser cobrado em dobro.</div>') +
      '<div class="legal">' + ico('lock', 13) + '<span>Você autoriza uma vez. Depois disso a cobrança de ' +
      brl(a.valueCents || 0) + ' se repete todo mês, e pode ser cancelada por aqui ou no seu banco.</span></div>' +
    '</div></div>';
  }

  // OS MEIOS QUE ESTA ASSINATURA ACEITA, na ordem em que fazem sentido para
  // quem compra: o que menos atrito tem primeiro.
  var METODOS_ASS = [
    ['pix', 'Pix Automático', 'Você autoriza uma vez no seu banco e pronto.'],
    ['credito', 'Cartão de crédito', 'Cobrado no cartão todo mês, automaticamente.'],
    ['boleto', 'Boleto', 'Um boleto novo a cada mês, para você pagar.']
  ];

  function metodosAceitos() {
    var m = (data.assinatura && data.assinatura.metodos) || {};
    return METODOS_ASS.filter(function (x) { return m[x[0]]; });
  }

  // O meio escolhido. Começa no primeiro aceito — e não num padrão fixo, que
  // apareceria marcado mesmo quando o lojista o desligou.
  var metodoAss = '';
  function metodoAtual() {
    var lista = metodosAceitos();
    if (!lista.length) return '';
    var achou = lista.some(function (x) { return x[0] === metodoAss; });
    if (!achou) metodoAss = lista[0][0];
    return metodoAss;
  }
  // Troca o meio SEM redesenhar a página inteira: um `render()` aqui apagaria
  // o que a pessoa já digitou nos campos, e escolher a forma de pagamento
  // depois de preencher o nome é o caminho natural.
  function setMetodoAss(m) {
    metodoAss = m;
    var bts = document.querySelectorAll('.met');
    for (var i = 0; i < bts.length; i++) {
      var on = bts[i].getAttribute('data-met') === m;
      bts[i].classList.toggle('on', on);
      bts[i].setAttribute('aria-pressed', String(on));
    }
  }

  // COM UM MEIO SÓ, NÃO HÁ ESCOLHA A FAZER. Desenhar um seletor de uma opção
  // pede uma decisão que não existe e ainda sugere que falta alguma coisa.
  function escolhaDeMetodo() {
    var lista = metodosAceitos();
    if (lista.length < 2) return '';
    var atual = metodoAtual();
    return '<div class="fld"><label>Como você quer pagar</label>' +
      '<div class="met-list">' + lista.map(function (x) {
        var on = x[0] === atual;
        return '<button type="button" class="met' + (on ? ' on' : '') + '" ' +
          'data-met="' + esc(x[0]) + '" aria-pressed="' + on + '">' +
          '<span class="met-dot"></span>' +
          '<span><b>' + esc(x[1]) + '</b><em>' + esc(x[2]) + '</em></span></button>';
      }).join('') + '</div></div>';
  }

  function identifyMain(ck) {
    var pf = data.prefill || {};
    return '<div class="card fade-in">' + stepsBar(1) +
      '<div class="pad">' +
        '<h2 class="sect">Seus dados</h2>' +
        // Cliente que já comprou aqui: os campos vêm preenchidos e a frase
        // muda, para ele entender de onde vieram os dados em vez de estranhar.
        '<div class="sect-sub">' + (ehAssinatura()
          ? 'Preencha para assinar. A cobrança é mensal e você autoriza uma vez no seu banco.'
          : pf.conhecido
            ? 'Confira seus dados e siga para o pagamento. Pode alterar o que quiser.'
            : 'Preencha para gerar o seu Pix, leva menos de um minuto.') + '</div>' +
        // O AVISO DE RECORRÊNCIA VEM ANTES DOS CAMPOS, e não no rodapé em letra
        // miúda. É a diferença entre pagar uma vez e autorizar um débito todo
        // mês — quem descobre isso depois pede o dinheiro de volta, e com razão.
        (ehAssinatura()
          ? '<div class="payer-chip">' + ico('lock', 13) + ' Assinatura mensal de ' + brl(data.assinatura.valueCents) +
            '. A cobrança se repete todo mês até você cancelar.</div>' + escolhaDeMetodo()
          : '') +
        (pf.conhecido ? '<div class="payer-chip">' + ico('lock', 13) + ' Que bom te ver de novo! Já preenchemos com os dados da sua última compra.</div>' : '') +
        '<div class="form-err" id="ferr"></div>' +
        '<div class="fld"><label>Nome completo</label><input id="f-name" autocomplete="name" placeholder="Como no seu documento" value="' + esc(pf.name || '') + '"></div>' +
        '<div class="fld"><label>CPF ou CNPJ</label><input id="f-doc" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="' + esc(pf.taxID ? maskDoc(pf.taxID) : '') + '"></div>' +
        '<div class="frow">' +
          '<div class="fld"><label>E-mail</label><input id="f-email" type="email" autocomplete="email" placeholder="voce@email.com" value="' + esc(pf.email || '') + '"></div>' +
          '<div class="fld"><label>Celular / WhatsApp</label><input id="f-phone" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678" value="' + esc(pf.phone ? maskPhone(pf.phone) : '') + '"></div>' +
        '</div>' +
        '<div class="legal">' + ico('lock', 13) + '<span>Seus dados são usados apenas para emitir esta cobrança e enviar a confirmação.</span></div>' +
      '</div></div>';

  function bindIdentify() {
    var lista = document.querySelector('.met-list');
    if (lista) {
      lista.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('.met') : null;
        if (b && b.getAttribute('data-met')) setMetodoAss(b.getAttribute('data-met'));
      });
    }
    var fd = document.getElementById('f-doc'), fp = document.getElementById('f-phone');
    if (fd) {
      fd.addEventListener('input', function () {
        fd.value = maskDoc(fd.value);
        // enquanto digita, só limpa o vermelho — avisar de "inválido" a cada
        // tecla acusa o campo antes de a pessoa terminar de preencher
        if (docOk(fd.value)) fd.classList.remove('bad');
      });
      // ao sair do campo, aí sim: o erro aparece na hora, sem esperar o envio
      fd.addEventListener('blur', function () {
        var e = fd.value.replace(/\D/g, '') ? docErro(fd.value) : '';
        fd.classList.toggle('bad', !!e);
        var box = document.getElementById('ferr');
        if (!box) return;
        if (e) { box.textContent = e; box.classList.add('show'); }
        else if (!document.querySelectorAll('#ferr ~ * .bad, .fld input.bad').length) box.classList.remove('show');
      });
    }
    if (fp) fp.addEventListener('input', function () { fp.value = maskPhone(fp.value); });
    var btn = document.getElementById('go-pay');
    if (btn) btn.onclick = submitIdentify;
  }

  // origem do tráfego (tracking), enviada junto na identificação
  function trkData() {
    var q = new URLSearchParams(location.search);
    var sid = localStorage.getItem('ec_sid');
    if (!sid) { sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); try { localStorage.setItem('ec_sid', sid); } catch (e) {} }
    var utm = {};
    ['source', 'medium', 'campaign', 'content', 'term'].forEach(function (k) { var v = q.get('utm_' + k); if (v) utm[k] = v; });
    return { sid: sid, fbclid: q.get('fbclid') || '', gclid: q.get('gclid') || '', ttclid: q.get('ttclid') || '', utm: utm };
  }

  function submitIdentify() {
    var btn = document.getElementById('go-pay');
    var err = document.getElementById('ferr');
    var f = {
      name: document.getElementById('f-name').value.trim(),
      taxID: document.getElementById('f-doc').value,
      email: document.getElementById('f-email').value.trim(),
      phone: document.getElementById('f-phone').value,
      trk: trkData()
    };
    var bad = [];
    if (f.name.length < 3) bad.push('f-name');
    var eDoc = docErro(f.taxID); if (eDoc) bad.push('f-doc');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) bad.push('f-email');
    if (f.phone.replace(/\D/g, '').length < 10) bad.push('f-phone');
    ['f-name', 'f-doc', 'f-email', 'f-phone'].forEach(function (i) { document.getElementById(i).classList.toggle('bad', bad.indexOf(i) >= 0); });
    // Quando o único problema é o documento, a mensagem é a do documento —
    // "confira os campos destacados" não diz que o CPF não fecha a conta.
    if (bad.length) {
      err.textContent = (bad.length === 1 && eDoc) ? eDoc : 'Confira os campos destacados.';
      err.classList.add('show'); return;
    }
    err.classList.remove('show');

    if (data.demo) { data.needsId = false; data.payerName = f.name; render(); return; }

    btn.disabled = true; btn.textContent = 'Gerando seu Pix…';
    // NO LINK DO PRODUTO é aqui que a cobrança nasce. A resposta volta no
    // formato da cobrança, com o id — daí em diante a página é a de sempre.
    var rota = apelidoProduto
      ? '/api/public/produto/' + encodeURIComponent(apelidoProduto) + '/identify'
      : '/api/public/pay/' + encodeURIComponent(id) + '/identify';
    if (ehAssinatura()) f.metodo = metodoAtual();
    fetch(rota, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(f)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Não foi possível validar seus dados');
        // ASSINATURA CRIADA: não há cobrança, não há QR, e a página não pode
        // seguir para a etapa de pagamento — o que falta é a autorização no
        // banco. Os cronômetros param aqui: eles existem para esperar um Pix
        // que, neste caminho, não vai chegar.
        // ASSINATURA NO PIX AUTOMÁTICO: não há cobrança, não há QR, e a página
        // não pode seguir para a etapa de pagamento — o que falta é a
        // autorização no banco. Os cronômetros param aqui: existem para esperar
        // um Pix que, neste caminho, não vai chegar.
        //
        // No CARTÃO e no BOLETO vem `view` junto: o primeiro ciclo é uma
        // cobrança de verdade, e o caminho é o de sempre.
        if (res.j.assinatura && !res.j.view) {
          clearInterval(timer); clearTimeout(cdTimer); clearTimeout(offerTimer);
          var ckA = (data && data.checkout) || {};
          root.innerHTML = siteHead(ckA) + '<div class="wrap"><div class="grid">' +
            mainColumn(ckA, assinaturaMain(ckA, res.j.assinatura)) + summary(ckA, '') +
          '</div></div>';
          return;
        }
        data = res.j.view;
        // A cobrança acabou de nascer: o resto da página fala por id, e o
        // endereço da barra passa a ser o dela — recarregar não perde o Pix
        // gerado, e o link continua servindo para quem abrir depois.
        if (apelidoProduto && data && data.id) {
          id = data.id;
          apelidoProduto = '';
          try { history.replaceState(null, '', '/pay/' + id); } catch (e) {}
        }
        render(); toast('Dados confirmados! Agora é só pagar');
      })
      .catch(function (e) {
        err.textContent = e.message; err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Continuar para o pagamento';
      });
  }

  // ---------- etapa 2: pagamento ----------
  // Descrição do método no recibo: "Pix" ou "Crédito · VISA ****1234 · 3x".
  function metodoPago() {
    if (data.method !== 'card' || !data.paidCard) return 'Pix';
    var c = data.paidCard;
    var partes = [c.kind === 'boleto' ? 'Boleto' : 'Crédito'];
    if (c.brand) partes.push(String(c.brand).toUpperCase());
    if (c.last4) partes.push('••••' + c.last4);
    if (c.installments > 1) partes.push(c.installments + 'x');
    return esc(partes.join(' · '));
  }

  // Método escolhido na tela de pagamento: 'pix' (padrão) ou 'card'.
  var payTab = 'pix';
  // Métodos EFETIVOS = cruzamento do que a plataforma processa (data.card) com
  // o que o lojista ligou neste checkout (data.checkout.methods). Nunca deixa
  // o cliente sem meio: se sobrar nada, o Pix volta.
  function payMethods() {
    var c = data.card || {}, m = (data.checkout && data.checkout.methods) || {};
    var pix = m.pix !== false;
    var credit = !!c.credit && !!m.credit && !data.demo;
    var boleto = !!c.boleto && !!m.boleto && !data.demo;
    // CICLO DE ASSINATURA ACEITA UM MEIO SÓ. `pixOff` vem do servidor quando
    // esta cobrança é o ciclo de uma assinatura de cartão ou de boleto — e é o
    // servidor que decide, não esta função: pagar no Pix o primeiro ciclo de
    // uma assinatura de CARTÃO deixaria a assinatura ativa e sem cartão salvo,
    // e o mês seguinte falharia num assinante que pagou direitinho.
    if (c.pixOff) pix = false;
    if (!pix && !credit && !boleto) pix = true;
    return { pix: pix, credit: credit, boleto: boleto };
  }
  function cardOn() { return payMethods().credit; }

  function payMain(ck) {
    var pm = payMethods();
    // aba selecionada precisa existir de verdade, cai na primeira disponível
    var disponiveis = [];
    if (pm.pix) disponiveis.push('pix');
    if (pm.credit) disponiveis.push('card');
    if (pm.boleto) disponiveis.push('boleto');
    if (disponiveis.indexOf(payTab) < 0) payTab = disponiveis[0] || 'pix';
    // Abre já na aba do meio que a pessoa escolheu ao assinar. Cair na primeira
    // disponível a faria escolher duas vezes a mesma coisa.
    var doCiclo = data.assinaturaDoCiclo;
    if (doCiclo) {
      var alvo = doCiclo.metodo === 'credito' ? 'card' : doCiclo.metodo === 'boleto' ? 'boleto' : 'pix';
      if (disponiveis.indexOf(alvo) >= 0) payTab = alvo;
    }

    var rotulo = { pix: pix + ' Pix', card: icoCard() + ' Cartão', boleto: icoBoleto() + ' Boleto' };
    var abas = disponiveis.length > 1
      ? '<div class="paytabs">' + disponiveis.map(function (t) {
          return '<button class="' + (payTab === t ? 'on' : '') + '" data-tab="' + t + '">' + rotulo[t] + '</button>';
        }).join('') + '</div>'
      : '';
    var painel = payTab === 'card' ? cardForm() : (payTab === 'boleto' ? boletoForm() : pixPane());
    var avisoCiclo = doCiclo
      ? '<div class="payer-chip">' + ico('lock', 13) + ' Primeira cobrança da sua assinatura de ' +
        esc(doCiclo.nome || '') + '. As próximas se repetem todo mês, e você pode cancelar quando quiser.</div>'
      : '';
    return '<div class="card fade-in">' + stepsBar(2) +
      '<div class="pad">' + abas + avisoCiclo + painel +
      '</div></div>';
  }

  function icoBoleto() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M17 5v14M20 5v14"/></svg>';
  }

  // Formulário do boleto: só precisa de nome e documento do pagador.
  function boletoForm() {
    return '<h2 class="sect">Pague com boleto</h2>' +
      '<div class="sect-sub">O boleto é gerado na hora. A confirmação chega quando o banco compensar o pagamento, o que costuma levar até 2 dias úteis.</div>' +
      '<div class="form-err" id="berr"></div>' +

        '<div class="frow">' +
          '<div class="fld"><label>Nome do pagador</label><input id="b-holder" placeholder="Nome completo" value="' + esc((data.prefill || {}).name || '') + '"></div>' +
          '<div class="fld"><label>CPF ou CNPJ</label><input id="b-doc" inputmode="numeric" placeholder="000.000.000-00" value="' + esc((data.prefill || {}).taxID ? maskDoc(data.prefill.taxID) : '') + '"></div>' +
        '</div>') +
      (data.payerName ? '<div class="fld"><label>CPF ou CNPJ do pagador</label><input id="b-doc" inputmode="numeric" placeholder="000.000.000-00"></div>' : '') +
      '<button class="btn" id="b-go">Gerar boleto de ' + brl(data.value) + '</button>' +
      '<div id="b-out"></div>';

  function bindBoleto() {
    var btn = document.getElementById('b-go');
    if (!btn) return;
    btn.onclick = function () {
      var erro = document.getElementById('berr');
      var docEl = document.getElementById('b-doc');
      var nomeEl = document.getElementById('b-holder');
      var doc = docEl ? docEl.value.replace(/\D/g, '') : '';
      erro.style.display = 'none';
      var eDoc = docErro(doc);
      if (eDoc) {
        erro.textContent = eDoc;
        erro.style.display = 'block';
        if (docEl) docEl.classList.add('bad');
        return;
      }
      if (docEl) docEl.classList.remove('bad');
      var original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Emitindo…';
      fetch('/api/public/pay/' + encodeURIComponent(id) + '/boleto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer: { name: nomeEl ? nomeEl.value.trim() : (data.payerName || ''), taxId: doc } })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j.error || 'Não foi possível emitir o boleto');
          var b = res.j.boleto || {};
          document.getElementById('b-out').innerHTML =
            '<div class="orlbl">LINHA DIGITÁVEL</div>' +
            '<div class="copywrap"><input readonly id="bline" value="' + esc(b.line || '') + '" onclick="this.select()"><button class="cbtn" id="bcopy">Copiar</button></div>' +
            (b.url ? '<a class="btn" style="margin-top:12px;display:block;text-align:center;text-decoration:none" href="' + esc(b.url) + '" target="_blank" rel="noopener">Abrir boleto em PDF</a>' : '') +
            '<div class="sum-note">' + ico('clock', 12) + ' Assim que o banco compensar, o pagamento é confirmado automaticamente.</div>';
          btn.style.display = 'none';
          var cp = document.getElementById('bcopy');
          if (cp) cp.onclick = function () {
            var el = document.getElementById('bline'); el.select();
            (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject())
              .then(function () { toast('Linha digitável copiada!'); })
              .catch(function () { document.execCommand('copy'); toast('Linha digitável copiada!'); });
          };
        })
        .catch(function (e) {
          erro.textContent = e.message; erro.style.display = 'block';
          btn.disabled = false; btn.textContent = original;
        });
    };
  }

  function icoCard() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>';
  }

  // AS BANDEIRAS. `bin` é a faixa inicial que cada uma registra; a ordem
  // importa: Elo e Hipercard usam faixas brasileiras que também casariam com
  // a regra genérica de Visa e Mastercard, então vêm antes.
  var BANDEIRAS = [
    { id: 'elo', nome: 'Elo', bin: /^(4011(78|79)|43(1274|8935)|45(1416|7393|7631|7632)|504175|506[6-7][0-9]{2}|509[0-9]{3}|627780|636(297|368|369)|650[0-9]{3}|6516[5-7][0-9]|655[0-9]{3})/ },
    { id: 'hipercard', nome: 'Hipercard', bin: /^(606282|3841[0-9]{2})/ },
    { id: 'amex', nome: 'American Express', bin: /^3[47]/ },
    { id: 'diners', nome: 'Diners Club', bin: /^3(0[0-5]|[68])/ },
    { id: 'mastercard', nome: 'Mastercard', bin: /^(5[1-5]|2(2[2-9][1-9]|[3-6][0-9]{2}|7([01][0-9]|20)))/ },
    { id: 'visa', nome: 'Visa', bin: /^4/ }
  ];
  // Só desenhamos as que temos arte. As outras continuam sendo aceitas pelo
  // adquirente e detectadas aqui — elas só não acendem um logo.
  var COM_ARTE = ['visa', 'mastercard'];

  function bandeiraDe(numero) {
    var n = String(numero || '').replace(/\D/g, '');
    if (n.length < 4) return null;
    for (var i = 0; i < BANDEIRAS.length; i++) if (BANDEIRAS[i].bin.test(n)) return BANDEIRAS[i];
    return null;
  }

  function bandeirasHtml(ativa) {
    return '<div class="bandeiras" id="bandeiras">' + COM_ARTE.map(function (b) {
      return '<img src="/assets/bandeiras/' + b + '.svg" alt="' + b + '" class="' +
             (ativa ? (ativa === b ? 'on' : 'off') : '') + '">';
    }).join('') + '<span class="bandeira-mais' + (ativa && COM_ARTE.indexOf(ativa) < 0 ? ' on' : '') + '">' +
      (ativa && COM_ARTE.indexOf(ativa) < 0 ? esc(nomeBandeira(ativa)) : 'e outras') + '</span></div>';
  }
  function nomeBandeira(id) {
    for (var i = 0; i < BANDEIRAS.length; i++) if (BANDEIRAS[i].id === id) return BANDEIRAS[i].nome;
    return '';
  }

  function cardForm() {

      : '';

    return '<h2 class="sect">Pague com cartão</h2>' +
      '<div class="sect-sub">Seus dados são enviados direto ao processador, com criptografia.</div>' +
      '<div class="form-err" id="cerr"></div>' + tipos +
      '<div class="fld"><label>Número do cartão</label><input id="c-num" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="23"></div>' +
      bandeirasHtml(null) +
      '<div class="fld"><label>Nome impresso no cartão</label><input id="c-name" autocomplete="cc-name" placeholder="Como está no cartão"></div>' +
      '<div class="frow">' +
        '<div class="fld"><label>Validade</label><input id="c-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5"></div>' +
        '<div class="fld"><label>CVV</label><input id="c-cvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"></div>' +
      '</div>' + selParcelas +
      (data.payerName ? '' :
        '<div class="frow">' +
          '<div class="fld"><label>Nome do titular</label><input id="c-holder" placeholder="Nome completo" value="' + esc((data.prefill || {}).name || '') + '"></div>' +
          '<div class="fld"><label>CPF do titular</label><input id="c-doc" inputmode="numeric" placeholder="000.000.000-00" value="' + esc((data.prefill || {}).taxID ? maskDoc(data.prefill.taxID) : '') + '"></div>' +
        '</div>') +
      '<button class="btn" id="c-go">Pagar ' + brl(data.value) + '</button>' +
      '<div class="sum-note">' + ico('lock', 12) + ' Não guardamos o número do seu cartão</div>';
  }

  function bindPay() {
    var tabs = document.querySelectorAll('.paytabs button');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].onclick = function () { payTab = this.getAttribute('data-tab'); render(); };
    }
    if (payTab === 'card') return bindCard();
    if (payTab === 'boleto') return bindBoleto();

    var c2 = document.getElementById('copy2'); if (!c2) return;
    c2.onclick = function () {
      var el = document.getElementById('brcode'); el.select();
      (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject())
        .then(function () { toast('Código Pix copiado! Cole no app do seu banco'); })
        .catch(function () { document.execCommand('copy'); toast('Código Pix copiado!'); });
    };
    countdown(data.expiresAt);
  }

  function bindCard() {
    var num = document.getElementById('c-num');
    var exp = document.getElementById('c-exp');
    var cvv = document.getElementById('c-cvv');
    var doc = document.getElementById('c-doc');

    // máscaras
    num.oninput = function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 19).replace(/(\d{4})(?=\d)/g, '$1 ').trim();
      // A bandeira acende com quatro dígitos: é a confirmação mais barata que
      // existe de que o número começou certo, e não custa nem uma requisição.
      var b = bandeiraDe(this.value);
      var fila = document.getElementById('bandeiras');
      if (fila) fila.outerHTML = bandeirasHtml(b ? b.id : null);
    };
    exp.oninput = function () {
      var v = this.value.replace(/\D/g, '').slice(0, 4);
      this.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
    };
    cvv.oninput = function () { this.value = this.value.replace(/\D/g, '').slice(0, 4); };
    if (doc) doc.oninput = function () { this.value = maskDoc(this.value); };

    // crédito/débito muda a visibilidade das parcelas
    var radios = document.querySelectorAll('input[name="ckind"]');
    for (var i = 0; i < radios.length; i++) {
      radios[i].onchange = function () {
        var wrap = document.getElementById('inst-wrap');
        if (wrap) wrap.style.display = '';
        var labels = document.querySelectorAll('.kind');
        for (var j = 0; j < labels.length; j++) labels[j].classList.remove('on');
        this.parentNode.classList.add('on');
      };
    }

    document.getElementById('c-go').onclick = submitCard;
  }

  function cardErr(msg) {
    var box = document.getElementById('cerr');
    box.textContent = msg || '';
    box.style.display = msg ? 'block' : 'none';
    if (msg) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function submitCard() {
    var btn = document.getElementById('c-go');
    // radio marcado (2 tipos) OU o input oculto (tipo único)
    var kindEl = document.querySelector('input[name="ckind"]:checked') || document.querySelector('input[type="hidden"][name="ckind"]');
    var kind = 'credit';
    var num = document.getElementById('c-num').value.replace(/\D/g, '');
    var nome = document.getElementById('c-name').value.trim();
    var exp = document.getElementById('c-exp').value.split('/');
    var cvv = document.getElementById('c-cvv').value.trim();
    var instEl = document.getElementById('c-inst');
    var holderEl = document.getElementById('c-holder');
    var docEl = document.getElementById('c-doc');

    if (num.length < 13) return cardErr('Confira o número do cartão.');
    if (!nome) return cardErr('Informe o nome impresso no cartão.');
    if (exp.length !== 2 || exp[0].length !== 2 || exp[1].length !== 2) return cardErr('Informe a validade no formato MM/AA.');
    var mes = Number(exp[0]);
    if (mes < 1 || mes > 12) return cardErr('Mês de validade inválido.');
    if (cvv.length < 3) return cardErr('Informe o CVV (3 ou 4 dígitos).');
    if (docEl) { var eDoc = docErro(docEl.value); if (eDoc) return cardErr(eDoc); }

    cardErr('');
    btn.disabled = true;
    var textoOriginal = btn.textContent;
    btn.textContent = 'Processando…';

    fetch('/api/public/pay/' + encodeURIComponent(id) + '/card', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        kind: kind,
        installments: instEl ? Number(instEl.value) : 1,
        card: { number: num, holderName: nome, expMonth: exp[0], expYear: exp[1], cvv: cvv },
        customer: {
          name: holderEl ? holderEl.value.trim() : '',
          taxId: docEl ? docEl.value.replace(/\D/g, '') : ''
        }
      })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'Não foi possível processar o pagamento.');
      if (res.j.status === 'paid') { load(); return; }          // vira a tela de sucesso
      btn.disabled = false; btn.textContent = textoOriginal;
      toast(res.j.message || 'Pagamento em análise.');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = textoOriginal;
      cardErr(e.message);
    });
  }

  // ---------- render ----------
  function render() {
    var ck = data.checkout || {};
    document.documentElement.style.setProperty('--ac', ck.color || '#2ed378');
    // Claro ou escuro, escolhido no Checkout Builder.
    if (ck.tema === 'claro') document.documentElement.setAttribute('data-tema', 'claro');
    else document.documentElement.removeAttribute('data-tema');
    // O BOTÃO. Brilhante quer dizer uma faixa de luz atravessando; chapado é
    // o acento puro. Sem cores próprias, a faixa é derivada do acento, então
    // o checkout de quem escolheu roxo continua roxo sem configurar nada.
    var bt = ck.botao || {};
    var raiz = document.documentElement;
    if (bt.brilhante === false) { raiz.setAttribute('data-botao', 'chapado'); }
    else {
      raiz.removeAttribute('data-botao');
      if (bt.cores && bt.cores.length >= 2) {
        // A primeira cor se repete nas pontas: é isso que faz as do meio
        // virarem faixa em vez de degradê de ponta a ponta.
        var pal = bt.cores.slice(0, 6);
        var par = [pal[0], pal[0]].concat(pal.slice(1)).concat([pal[0], pal[0]]);
        raiz.style.setProperty('--btn-grad',
          'linear-gradient(' + ((+bt.angulo || 45) + 'deg') + ', ' + par.join(', ') + ')');
      } else {
        raiz.style.removeProperty('--btn-grad');
      }
      if (bt.angulo) raiz.style.setProperty('--btn-ang', (+bt.angulo || 45) + 'deg');
    }
    document.title = (ck.title || ck.merchant || 'Pagamento') + '. Pix';

    if (data.demo && !document.querySelector('.demo-tag')) {
      var tag = document.createElement('div'); tag.className = 'demo-tag'; tag.textContent = '👁 Pré-visualização'; document.body.appendChild(tag);
    }

    if (data.status === 'paid') {
      root.innerHTML = siteHead(ck) + '<div class="wrap"><div class="grid">' +
        '<div class="card fade-in"><div class="final ok">' +
          '<div class="fic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="' + esc(ck.color || '#2ed378') + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
          '<h2>Pagamento concluído</h2>' +
          '<p>' + esc(ck.successMsg || ('Recebemos seu pagamento' + (ck.merchant ? ', ' + ck.merchant : '') + '. Obrigado!')) + '</p>' +
          '<div class="receipt">' +
            '<div><span>Produto</span><b>' + esc(ck.title || 'Pagamento Pix') + '</b></div>' +
            (data.payerName ? '<div><span>Pagador</span><b>' + esc(data.payerName) + '</b></div>' : '') +
            '<div><span>Valor</span><b>' + brl(data.value) + '</b></div>' +
            '<div><span>Data</span><b>' + new Date(data.paidAt || Date.now()).toLocaleString('pt-BR') + '</b></div>' +
            '<div><span>Método</span><b>' + metodoPago() + '</b></div>' +
          '</div>' +
        '</div></div>' + summary(ck, '') + '</div></div>';
      clearInterval(timer); clearTimeout(cdTimer); clearTimeout(offerTimer);
      return;
    }
    if (data.status === 'cancelled' || data.status === 'expired') {
      root.innerHTML = siteHead(ck) + '<div class="wrap"><div class="grid">' +
        '<div class="card fade-in"><div class="final dead">' +
          '<div class="fic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>' +
          '<h2>' + (data.status === 'expired' ? 'Cobrança expirada' : 'Cobrança cancelada') + '</h2>' +
          '<p>Esta cobrança não está mais disponível para pagamento.' + (ck.supportText ? '\n\n' + esc(ck.supportText) : '\nFale com o vendedor para gerar uma nova.') + '</p>' +
        '</div></div>' + summary(ck, '') + '</div></div>';
      clearInterval(timer); clearTimeout(cdTimer); clearTimeout(offerTimer);
      return;
    }

    var stepOne = data.needsId;
    var cta = stepOne
      ? '<button class="btn" id="go-pay">' + (ehAssinatura() ? 'Assinar por ' + brl(data.assinatura.valueCents) + '/mês' : 'Continuar para o pagamento') + '</button>' +
        '<div class="sum-note">' + ico('lock', 12) + (ehAssinatura() ? ' Pix Automático · cancele quando quiser' : ' Pagamento 100% seguro via Pix') + '</div>'
      : '<div class="waiting"><span class="pulse"></span> Aguardando pagamento</div><div class="sum-note">A confirmação é automática assim que você pagar.</div>';

    root.innerHTML = siteHead(ck) + '<div class="wrap"><div class="grid">' +
      mainColumn(ck, stepOne ? identifyMain(ck) : payMain(ck)) + summary(ck, cta) +
    '</div></div>';
    if (stepOne) bindIdentify(); else bindPay();
    startOffer(ck);
  }

  // Tags de navegador do lojista (Meta Pixel, GTM, LinkedIn, UET, Snapchat,
  // Pinterest, Google Ads). Vêm prontas do servidor e entram uma única vez.
  // innerHTML não executa <script>, por isso recriamos cada tag.
  var tagsFeitas = false;
  function injectTags(html) {
    if (tagsFeitas || !html) return;
    tagsFeitas = true;
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var nos = tmp.querySelectorAll('script');
    for (var i = 0; i < nos.length; i++) {
      var s = document.createElement('script');
      if (nos[i].src) { s.src = nos[i].src; s.async = true; }
      else s.textContent = nos[i].textContent;
      document.head.appendChild(s);
    }
  }

  function load() {
    fetch(enderecoInicial())
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        var st = new URLSearchParams(location.search).get('s');
        if (d.demo && /^(paid|expired|cancelled)$/.test(st || '')) d.status = st;
        if (d.demo && st === 'pay') d.needsId = false;
        var was = data && (data.status + ':' + data.needsId);
        var now = d.status + ':' + d.needsId;
        data = d;
        injectTags(d.tags);
        if (!was || was !== now) render();
      })
      .catch(function () {
        if (!data) root.innerHTML = '<div class="wrap"><div class="card"><div class="final dead"><div class="fic">🔎</div><h2>Cobrança não encontrada</h2><p>Confira o link recebido ou peça um novo ao vendedor.</p></div></div></div>';
      });
  }

  // re-renderiza ao virar o dispositivo (troca banner/logo desktop↔mobile)
  var wasMobile = isMobile();
  window.addEventListener('resize', function () {
    if (isMobile() !== wasMobile) { wasMobile = isMobile(); if (data) render(); }
  });

  load();
  timer = setInterval(function () { if (data && data.status === 'active' && !data.needsId && !data.demo) load(); }, 4000);
})();
</script>
</body>
</html>
