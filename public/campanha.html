<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Link de acompanhamento é para quem recebeu o endereço, não para o Google. -->
<meta name="robots" content="noindex, nofollow">
<title>Acompanhar campanha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="/marca/logo">
<!-- A FOLHA DO APP, e não uma folha própria. Esta página mostra o MESMO
     relatório que o painel mostra, para o cliente de quem disparou. Com uma
     segunda folha de estilo, o primeiro ajuste esquecido faria as duas telas
     divergirem — e quem dispara precisa saber exatamente o que o cliente dele
     está vendo. De quebra vêm os tokens da marca e o tema escuro. -->
<link rel="stylesheet" href="/app/style.css?v=pipe2">
<link rel="stylesheet" href="/tema.css">
<style>
  /* Só a moldura. Aqui não há menu, não há login e não há nada em que clicar
     além do próprio relatório: quem abre é o cliente da agência que contratou
     o disparo, e ele não vai criar conta. */
  body { background: var(--bg); }
  .pub { max-width: 1080px; margin: 0 auto; padding: 22px 18px 60px; }
  .pub-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .pub-topo img { width: 28px; height: 28px; border-radius: 8px; }
  .pub-topo b { font-size: 15px; letter-spacing: -.02em; }
  .pub-topo span { margin-left: auto; font-size: 12px; color: var(--muted); }
  .pub-vazio { text-align: center; padding: 46px 22px; color: var(--muted); }
  .pub-vazio b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  /* ---- CONVITE ----
     Mesmo desenho do banner da dashboard: fundo escuro com a arte à direita,
     texto à esquerda. Quem clica cai no produto e vê a mesma arte — é o que
     faz esta página parecer parte da Koonfy, e não um anúncio colado nela. */
  .convite {
    position: relative; overflow: hidden; border-radius: 16px;
    margin: 0 0 22px; min-height: 172px; display: flex; align-items: center;
    background: #0b1a12; color: #fff;
  }
  .convite-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* O véu escurece o lado do texto e some antes da metade: a arte fica
     inteira à direita, onde a peça 3D aparece. */
  .convite-veu {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(6,20,13,.92) 0%, rgba(6,20,13,.76) 36%, rgba(6,20,13,0) 72%);
  }
  .convite-peca {
    position: absolute; right: 4%; top: 50%; transform: translateY(-50%) rotate(-8deg);
    height: 150px; width: auto; pointer-events: none;
    filter: drop-shadow(0 12px 22px rgba(0,0,0,.4));
  }
  .convite-txt { position: relative; z-index: 2; padding: 22px 24px; max-width: 64%; }
  .convite-tag {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: rgba(255,255,255,.8);
  }
  .convite-txt h2 { margin: 6px 0 0; font-size: clamp(17px, 2.4vw, 23px); letter-spacing: -.02em; color: #fff; }
  .convite-txt p { margin: 7px 0 0; font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .convite-btn {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
    background: #fff; color: #10241a; font: 600 13px/1 inherit;
    padding: 11px 17px; border-radius: 9px; text-decoration: none;
  }
  /* No celular a peça sai do caminho do texto: em 375px as duas coisas
     disputam a mesma faixa, e quem perde é a frase. */
  @media (max-width: 620px) {
    .convite { min-height: 0; }
    .convite-txt { max-width: 100%; padding: 20px; }
    .convite-peca { height: 96px; right: -14px; opacity: .5; }
  }

  .pub-pe { margin-top: 26px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .pub-pe a { color: var(--verde-deep); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="pub">
    <div class="pub-topo">
      <img src="/marca/logo" alt="">
      <b>Koonfy</b>
      <span id="atualizado"></span>
    </div>

    <!-- O CONVITE fica no TOPO. Quem abre este link acabou de ver o produto
         funcionando com os numeros dele na tela — e no fim da pagina, depois
         de uma tabela de duzentos destinatarios, a maioria nao chega. -->
    <div id="convite"></div>

    <div class="page-head row" style="align-items:center">
      <div style="flex:1">
        <h1 id="tit">Campanha</h1>
        <p id="sub"></p>
      </div>
      <span class="bi-vivo" id="selo"><i></i>ao vivo</span>
    </div>

    <div id="bi"><div class="card"><div class="pub-vazio"><b>Carregando…</b>Buscando os números da campanha.</div></div></div>
    <p class="pub-pe">Acompanhamento em tempo real por Koonfy</p>
  </div>

<script src="/bi.js?v=2"></script>
<script>
/* ===========================================================================
   O token vem do ENDEREÇO, e nunca de um campo: esta página não tem login e
   não deve ter. Quem tem o link vê; quem não tem, não.

   AO VIVO POR SSE, e não por pergunta repetida. O painel já transmite um
   evento a cada destinatário processado; esta página se inscreve na mesma
   transmissão, restrita à campanha do link. Perguntar de três em três segundos
   custaria um relatório inteiro por espectador por pergunta, e ainda mostraria
   o número três segundos atrasado.

   E há a rede real: quando a transmissão cai (celular que troca de Wi-Fi para
   4G, aba que dormiu), o EventSource reconecta sozinho, mas o que aconteceu no
   intervalo não volta. Por isso existe uma busca de segurança a cada 30
   segundos e outra quando a aba volta a ficar visível.
   =========================================================================== */
(function () {
  var token = (location.pathname.split('/').filter(Boolean).pop() || '').trim();
  var alvo = document.getElementById('bi');
  var carimbo = document.getElementById('atualizado');
  var ultimo = 0, buscando = false;

  function erro(titulo, txt) {
    alvo.dataset.montado = '';
    alvo.innerHTML = '<div class="card"><div class="pub-vazio"><b>' + KoonfyBI.esc(titulo) + '</b>' + KoonfyBI.esc(txt) + '</div></div>';
    document.getElementById('selo').style.display = 'none';
  }

  // O convite é desenhado UMA vez: ele não muda com os números, e refazê-lo a
  // cada atualização faria a imagem piscar a cada destinatário processado.
  var convitePronto = false;
  function convite(rel) {
    if (convitePronto || !rel.convite || !rel.convite.link) return;
    convitePronto = true;
    document.getElementById('convite').innerHTML =
      '<a class="convite" href="' + KoonfyBI.esc(rel.convite.link) + '" target="_blank" rel="noopener" style="text-decoration:none">' +
        '<img class="convite-bg" src="/assets/banner-bg-indique.webp" alt="" aria-hidden="true" loading="lazy" decoding="async">' +
        '<span class="convite-veu"></span>' +
        '<img class="convite-peca" src="/assets/banner-ic-indique.webp" alt="" aria-hidden="true" width="560" height="594" loading="lazy" decoding="async">' +
        '<span class="convite-txt">' +
          '<span class="convite-tag">Feito com a Koonfy</span>' +
          '<h2>Seus disparos com este relatório</h2>' +
          '<p>Campanha no WhatsApp com entrega, leitura, clique e resposta ao vivo — e um link como este para mandar a quem contratou.</p>' +
          '<span class="convite-btn">Conhecer a Koonfy →</span>' +
        '</span>' +
      '</a>';
  }

  function cabecalho(rel) {
    document.getElementById('tit').textContent = rel.nome || 'Campanha';
    document.getElementById('sub').textContent = [
      rel.conta,
      rel.template ? 'Modelo ' + rel.template : '',
      rel.canal,
      rel.criadaEm ? KoonfyBI.quando(rel.criadaEm) : ''
    ].filter(Boolean).join(' · ');
    var rodando = rel.status !== 'done';
    var selo = document.getElementById('selo');
    selo.className = 'bi-vivo' + (rodando ? '' : ' fim');
    selo.innerHTML = '<i></i>' + (rodando ? 'ao vivo' : 'concluída');
  }

  async function buscar() {
    if (buscando) return;
    buscando = true;
    try {
      var r = await fetch('/api/public/campanha/' + encodeURIComponent(token), { cache: 'no-store' });
      if (r.status === 404) return erro('Link inválido ou revogado', 'Peça um novo endereço a quem enviou este.');
      if (!r.ok) throw new Error('http ' + r.status);
      var rel = await r.json();
      cabecalho(rel);
      convite(rel);
      // `estados: true` porque aqui não há o mapa do painel: a tabela por
      // estado é o que responde "de onde vieram os leads" sem ele.
      KoonfyBI.pintar(alvo, rel, { estados: true });
      ultimo = Date.now();
      carimbo.textContent = 'atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) {
      if (!ultimo) erro('Não deu para carregar', 'Verifique a conexão e recarregue a página.');
    } finally { buscando = false; }
  }

  function ouvir() {
    try {
      var es = new EventSource('/api/public/campanha/' + encodeURIComponent(token) + '/events');
      es.addEventListener('campaign', buscar);
      es.onerror = function () {};   // a reconexão é do próprio EventSource
    } catch (e) {}
  }

  if (!token || token.length < 16) return erro('Endereço incompleto', 'O link precisa terminar com o código da campanha.');
  buscar();
  ouvir();
  setInterval(function () { if (!document.hidden) buscar(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscar(); });
})();
</script>
</body>
</html>
